services:
  backend:
    container_name: golf_backend
    build:
      context: ./backend
      dockerfile: docker/local/Dockerfile
    ports:
      - "8080:80"
    env_file:
      - ./backend/.env
    restart: always
    volumes:
      - ./backend:/var/www/html
    networks:
      - global_proxy

networks:
  global_proxy:
    external: true
